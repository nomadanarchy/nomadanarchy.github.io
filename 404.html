<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomad Anarchy - 404</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #111;
            --card: #202020;
            --text: #f7f7f7;
            --muted: #888;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: min(500px, calc(100% - 40px));
            text-align: center;
            animation: fadeIn .7s cubic-bezier(.22, 1, .36, 1);
        }

        .card {
            background: var(--card);
            border-radius: 22px;
            padding: 45px 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, .2);
        }

        .error {
            font-size: 82px;
            font-weight: 800;
            letter-spacing: -4px;
            line-height: 1;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        p {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 15px;
        }

        .button {
            display: inline-block;
            padding: 13px 24px;
            border-radius: 28px;
            background: #292929;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            transition: transform .18s ease, background .18s ease;
        }

        .button:hover {
            transform: translateY(-2px);
            background: #333;
        }

        .button:active {
            transform: scale(.97);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .container {
                animation: none;
            }
        }

        @media (max-width: 500px) {
            .card {
                padding: 35px 25px;
            }

            .error {
                font-size: 65px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <div class="card">
            <div class="error">404</div>

            <h1>Page Not Found</h1>

            <p>
                The page you're looking for doesn't exist or has been moved.
            </p>

            <a class="button" href="/">
                Go Home
            </a>
        </div>
    </main>

</body>
</html>
