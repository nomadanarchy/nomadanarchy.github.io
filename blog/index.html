<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Server news, development updates, guides, stories and everything happening around Nomad Anarchy.">
  <meta name="theme-color" content="#07070b">
  <title>Blog — Nomad Anarchy</title>
  <link rel="stylesheet" href="./blog.css">
</head>
<body>
  <main class="blog-shell">
    <nav class="blog-nav">
      <a href="https://nomadanarchy.online/" class="blog-brand">← Nomad Anarchy</a>
    </nav>

    <header class="blog-hero">
      <div class="blog-eyebrow">Nomad Anarchy</div>
      <h1>From the <span>Frontier.</span></h1>
      <p>Server news, development updates, guides, stories and everything happening around Nomad.</p>
    </header>

    <section class="blog-toolbar" aria-label="Blog controls">
      <div id="post-count" class="post-count">posts</div>
      <label class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="6"></circle>
          <path d="m16 16 4 4"></path>
        </svg>
        <input id="blog-search" type="search" placeholder="Search posts..." autocomplete="off">
      </label>
    </section>

    <section id="post-list" class="post-grid" aria-live="polite"></section>
    <p id="no-results" class="post-error" hidden>No posts match your search.</p>
  </main>

  <footer class="blog-footer">
    <div class="blog-footer-inner">
      <strong>NOMAD ANARCHY</strong>
      <span>Not associated with Mojang or Microsoft.</span>
      <span>© 2026 Nomad Anarchy</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="./blog.js"></script>
</body>
</html>
